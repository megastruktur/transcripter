name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (ruff + pyright + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: API — lint, types, tests
        working-directory: server/api
        run: |
          uv sync
          uv run ruff check .
          uv run pyright
          uv run pytest -q
      - name: Worker — lint, types, tests
        working-directory: server/worker
        run: |
          uv sync
          uv run ruff check .
          uv run pyright
          uv run pytest -q

  client-rust:
    name: Client Rust (clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri
      - name: Install webkit deps (headless build)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libasound2-dev
      - name: clippy + tests
        working-directory: client/src-tauri
        run: |
          cargo clippy --lib -- -D warnings
          cargo test --lib

  client-web:
    name: Client Web (svelte-check + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - name: check + build
        working-directory: client
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm build
