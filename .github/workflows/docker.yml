name: Server image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to push (e.g. ci-test-<shortsha>)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Determine image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.image_tag }}"
            if [ -z "$TAG" ]; then
              TAG="ci-test-${GITHUB_SHA::8}"
            fi
          else
            # strip "refs/tags/" prefix
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: server/
          file: server/Dockerfile.api
          push: true
          platforms: linux/amd64
          build-args: |
            APP_VERSION=${{ steps.tag.outputs.tag }}
          tags: |
            ghcr.io/megastruktur/transcripter:${{ steps.tag.outputs.tag }}-api
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Worker image
        uses: docker/build-push-action@v7
        with:
          context: server/
          file: server/Dockerfile.worker
          platforms: linux/amd64
          build-args: |
            APP_VERSION=${{ steps.tag.outputs.tag }}
          tags: |
            ghcr.io/megastruktur/transcripter:${{ steps.tag.outputs.tag }}-worker
          cache-from: type=gha
          cache-to: type=gha,mode=max
