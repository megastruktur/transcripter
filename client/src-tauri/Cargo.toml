[package]
name = "transcripter"
version = "0.1.0"
edition = "2021"

[lib]
name = "transcripter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "compression", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
flacenc = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
anyhow = "1"
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-avf-audio = { version = "0.3", features = ["AVAudioApplication"] }
