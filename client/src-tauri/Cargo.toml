[package]
name = "transcripter"
version = "0.8.2"
edition = "2021"

[lib]
name = "transcripter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "compression", "x11", "macos-private-api", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "=0.18.2"
flacenc = "=0.5.1"
ringbuf = "=0.5.1"
# NOTE: no TLS backend on purpose for the LAN MVP — ring (rustls) cannot
# build under the zig-cc/gnu.2.38 host toolchain; https baseUrls are
# unsupported until the toolchain or a TLS impl builds. UI fetch still
# supports https where the webview does.
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
anyhow = "1"
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-avf-audio = { version = "=0.3.2", features = ["AVAudioApplication"] }
objc2-core-audio = { version = "=0.3.2", default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-foundation"] }
objc2-core-foundation = "=0.3.2"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSValue"] }
# System Audio Recording (kTCCServiceAudioCapture) check/request via the
# private TCC SPI — see capture_macos.rs for why this is unavoidable.
block2 = { version = "0.6", default-features = false, features = ["std"] }
libc = "0.2"
[target.'cfg(target_os = "windows")'.dependencies]
windows-registry = "0.6"
