[package]
name = "transcripter"
version = "0.23.0"
edition = "2021"

[lib]
name = "transcripter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Cross-platform deps. `tauri` features must be the MINIMUM set that compiles
# on every supported target — desktop-only features (x11, tray-icon) live in
# target-specific blocks below.
#
# Notes for the android build:
#   * `custom-protocol` is required so `tauri::generate_context!()` accepts
#     the in-app asset:// scheme that the generated Android shell loads.
#   * `macos-private-api` is harmlessly gated by cfg inside tauri on non-mac
#     builds, but it MUST stay in the base feature list because
#     `tauri.conf.json` declares `app.macOSPrivateApi: true` and the tauri
#     build script enforces that the corresponding feature is enabled
#     (otherwise `cargo check` aborts with a feature-allowlist error).
#   * `cpal` is desktop-only (ALSA on linux / CoreAudio on macOS / WASAPI on
#     Windows); on android the recording path runs through the WebView's
#     getUserMedia. Pulling cpal in for android targets adds `-laaudio` to
#     the link line and the build fails.
[dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "compression", "image-png", "custom-protocol", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flacenc = "=0.5.1"
ringbuf = "=0.5.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
anyhow = "1"
thiserror = "2"

# Linux + macOS — both need x11 (linux) and tray-icon (both). macos-private-api
# is harmless on linux (no-op) and required on macOS.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "compression", "x11", "tray-icon", "macos-private-api", "image-png", "custom-protocol"] }
cpal = "=0.18.2"

# Windows: same tauri surface as the other desktop targets — lib.rs compiles
# tray/menu code under cfg(windows) too, and pre-Android main had tray-icon
# enabled for every desktop target (release CI builds .msi with it).
[target.'cfg(target_os = "windows")'.dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "compression", "tray-icon", "image-png", "custom-protocol"] }
cpal = "=0.18.2"
windows-registry = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-avf-audio = { version = "=0.3.2", features = ["AVAudioApplication"] }
objc2-core-audio = { version = "=0.3.2", default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-foundation"] }
objc2-core-foundation = "=0.3.2"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSValue"] }
# System Audio Recording (kTCCServiceAudioCapture) check/request via the
# private TCC SPI — see capture_macos.rs for why this is unavoidable.
block2 = { version = "0.6", default-features = false, features = ["std"] }
libc = "0.2"
