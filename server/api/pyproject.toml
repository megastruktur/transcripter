[project]
name = "transcripter-api"
version = "0.1.0"
description = "Transcripter server API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "temporalio>=1.7",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    # Runtime, NOT dev: FastAPI checks for it at app import time when any
    # route declares Form/File params (POST /recordings/direct) and raises
    # RuntimeError without it; the image installs --no-dev.
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pyright>=1.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = [
	"B008",     # FastAPI Depends() in defaults is idiomatic
	"ASYNC230", # small local files; async file IO not worth it here
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pyright]
include = ["app"]
pythonVersion = "3.12"
