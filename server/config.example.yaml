# Transcripter server configuration (copy to config.yaml, mount into containers)
# Auth token is NOT set here: use env TRANSCRIPTER_TOKEN only.
# NOTE: the worker reads this file once at startup — apply changes with
# `docker compose restart worker`.

storage:
  # Root dir for recording folders. Mount point inside containers is /storage;
  # point the compose bind-mount at your NAS path on the host.
  path: /storage

transcripts:
  # Exported consolidated notes (one .md per call). The in-container path is
  # FIXED at /transcripts — the host dir is chosen by TRANSCRIPTS_DIR in .env
  # (compose bind), never overridden in yaml.
  # Optional boot-race guard: when set (e.g. ".obsidian"), export refuses to
  # run unless this entry exists under the dir — a bind over an empty NAS
  # mountpoint is writable but wrong, better to skip than misplace notes.
  sentinel: ""

transcribe:
  # local = faster-whisper in worker container; api = OpenAI-compatible endpoint
  backend: local
  # faster-whisper model name (local) or model id (api).
  # For Speaches use the full HF id — plain names like "small" are NOT
  # resolvable there and uncached models 404 (compose preloads the one below).
  model: small
  # Used only when backend=api. MUST include the /v1 suffix.
  # base_url: http://speaches:8000/v1
  base_url: ""
  # Env var name holding the API key (never the key itself). Empty is fine
  # for a local unauthenticated Speaches.
  api_key_env: ""

summarize:
  # Disabled unless model is set — recording pipeline succeeds with stage=skipped
  enabled: false
  # OpenAI-compatible model id, e.g. via LiteLLM proxy
  model: ""
  base_url: ""
  api_key_env: ""

diarization:
  # false → diarize/merge stages report `skipped`; no diarization container
  # or external service is contacted (bundled container: profile `diarization`).
  enabled: true
  # LinTO diarization service; override via env DIARIZATION_ENDPOINT when
  # it lives in a separate voice stack.
  endpoint: http://diarization:80

database:
  # Inside containers; postgres compose service
  url: postgresql+psycopg://transcripter:transcripter@postgres/transcripter
