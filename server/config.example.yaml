# Transcripter server configuration (copy to config.yaml, mount into containers)
# Auth token is NOT set here: use env TRANSCRIPTER_TOKEN only.
# NOTE: the worker reads this file once at startup — apply changes with
# `docker compose restart worker`.

storage:
  # Root dir for recording folders. Mount point inside containers is /storage;
  # point the compose bind-mount at your NAS path on the host.
  path: /storage

transcripts:
  # Exported notes (one folder per call, per-artifact .md files inside). The
  # in-container path is FIXED at /transcripts — the host dir is chosen by
  # TRANSCRIPTS_DIR in .env (compose bind), never overridden in yaml.
  # Optional boot-race guard: when set (e.g. ".transcripter"), export refuses
  # to run unless this marker exists INSIDE the dir (create it once:
  # touch "$TRANSCRIPTS_DIR/.transcripter") — a bind over an empty NAS
  # mountpoint is writable but wrong, better to skip than misplace notes.
  sentinel: ""

transcribe:
  # local = faster-whisper in worker container; api = OpenAI-compatible endpoint
  backend: local
  # faster-whisper model name (local) or model id (api).
  # For Speaches use the full HF id — plain names like "small" are NOT
  # resolvable there and uncached models 404 (compose preloads the one below).
  model: small
  # Used only when backend=api. MUST include the /v1 suffix.
  # base_url: http://speaches:8000/v1
  base_url: ""
  # Env var name holding the API key (never the key itself). Empty is fine
  # for a local unauthenticated Speaches.
  api_key_env: ""

summarize:
  # Disabled unless model is set — recording pipeline succeeds with stage=skipped
  enabled: false
  # OpenAI-compatible model id, e.g. via LiteLLM proxy
  model: ""
  base_url: ""
  api_key_env: ""
  # Phase 3: recap injects the first-tag digest context (the knowledge
  # base built from earlier sessions by the graph pipeline) into the
  # summarize prompt. Requires graph.enabled — no digest notes exist
  # without the graph, so this stays a no-op there.
  recap: true

diarization:
  # false → diarize/merge stages report `skipped`; no diarization container
  # or external service is contacted (bundled container: profile `diarization`).
  enabled: true
  # LinTO diarization service; override via env DIARIZATION_ENDPOINT when
  # it lives in a separate voice stack.
  endpoint: http://diarization:80
# chunk:
#   # Server-side slicing BEFORE transcribe/diarize: resets the STT decoder
#   # context per chunk, so a whisper repetition loop (long single requests
#   # on CPU stacks) poisons one ~10-min chunk instead of the whole
#   # recording. Chunks are transcribed SEQUENTIALLY — never in parallel.
#   # Off by default: short recordings gain nothing.
#   enabled: false
#   target_min: 10   # target chunk length
#   overlap_sec: 2   # shared band between neighbours (seam safety)

database:
  # Inside containers; postgres compose service
  url: postgresql+psycopg://transcripter:transcripter@postgres/transcripter

graph:
  # Optional Neo4j knowledge-graph backend (compose --profile graph).
  # Empty uri (or missing section) = enrich stage reports skipped.
  uri: ""
  user: neo4j
  password_env: NEO4J_PASSWORD
  database: neo4j
  # Periodic graph GC (seconds, 0 = off): sweeps graph nodes whose
  # recording no longer exists in the catalog (deleted recordings would
  # otherwise leave orphaned nodes forever). The first tick after startup
  # cleans any backlog.
#  gc_interval_sec: 3600
  # Phase 2: when NO profile matches the recording's type, enrich anyway
  # with the built-in fallback prompt (minimal generic ontology,
  # profile_id "builtin-fallback"). A profile that MATCHED but has no
  # enrich section still means opted out — only the no-match case falls
  # back. false → no-match recordings report stage skipped (pre-phase-2
  # behavior).
  enrich_all: true
  # Phase 2 auto-digest: after a successful enrich, refresh each affected
  # namespace's digest note (digests/<slug>.md) when the file is older
  # than auto_digest_window_sec or missing (last_n=5, best-effort — a
  # digest failure never fails the recording). Skipped stages never
  # trigger a refresh.
  auto_digest: true
  auto_digest_window_sec: 3600
  # Phase 2.5 embedding prefilter for entity dedup (see graph.embed below
  # for the backend): when vectors are available, slug collisions with
  # cosine >= embed_tau_high are merged WITHOUT the LLM, cosine <=
  # embed_tau_low are kept distinct WITHOUT it, and only the gray zone
  # between the thresholds gets an LLM Y/N call. A missing model or
  # failed load disables the prefilter (one warning) and dedup stays
  # pure-LLM — nothing else changes.
  embed_enabled: true
  embed_tau_high: 0.90
  embed_tau_low: 0.75
  # Phase 3.5 — pluggable embedding backend (the speaches pattern).
  # backend local (default): bge-m3 ONNX int8 in-process in the worker
  # (mounted at /models; fixed 1024-d; serves dedup prefilter AND the
  # per-tag semantic index). backend http: any OpenAI-compatible
  # POST {base_url}/embeddings — LiteLLM route, Infinity, Ollama, OpenAI;
  # `model` is the remote id, `api_key_env` names the env var with the
  # key, `dimensions` is REQUIRED for http (remote dimensionality is not
  # knowable offline). The worker honors EMBED_BACKEND / EMBED_BASE_URL /
  # EMBED_MODEL env overrides (see .env.example) — provider switches
  # without touching this file.
  # TRAP: switching backend/model changes the vector space — semantic
  # index files record {backend, model, dimensions} and a mismatch
  # triggers a rebuild (or a 503 + "run backfill" on search); the dedup
  # taus above were calibrated on bge-m3 and need recalibration for a
  # different model.
  embed:
    backend: local
    model_path: /models/bge-m3-int8
    # http backend example:
    # backend: http
    # base_url: http://infinity:7000/v1
    # model: bge-m3
    # api_key_env: EMBED_API_KEY
    # dimensions: 1024
