name: transcripter

services:
  api:
    image: ghcr.io/megastruktur/transcripter:v0.21.1-api
    ports:
      # LAN + loopback only — never 0.0.0.0 (Docker publish bypasses UFW).
      - "127.0.0.1:8090:8080"
      - "192.168.3.23:8090:8080"
    environment:
      TRANSCRIPTER_TOKEN: ${TRANSCRIPTER_TOKEN:?set TRANSCRIPTER_TOKEN in .env}
      TRANSCRIPTER_CONFIG: /etc/transcripter/config.yaml
      # Summarize model from .env — wins over config.yaml summarize.model
      # (keeps /settings truthful; the worker applies the same override).
      SUMMARIZE_MODEL: ${SUMMARIZE_MODEL:-}
      # Phase 3.5: embedding backend overrides for tag search — SAME
      # values the worker gets (the search query must be embedded by the
      # backend that indexed the segments; a mismatch 503s with a backfill
      # hint instead of searching across vector spaces).
      EMBED_BACKEND: ${EMBED_BACKEND:-}
      EMBED_BASE_URL: ${EMBED_BASE_URL:-}
      EMBED_MODEL: ${EMBED_MODEL:-}
      # graph.embed.api_key_env references this when the embed backend is
      # http (LiteLLM) — the api embeds search queries through the same
      # endpoint the worker indexed with. Harmless when unused.
      # Vault mode: VAULT_DIR set → the vault is the durable home (meta
      # tree moves there after the pipeline; storage = scratch). Empty →
      # storage mode (legacy, meta stays in /storage).
      TRANSCRIPTER_VAULT_MODE: ${TRANSCRIPTER_VAULT_MODE:-}
    volumes:
      # c2: staging is a named volume (local NVMe) — no dev-checkout binds.
      - staging:/storage
      - /srv/transcripter/config.yaml:/etc/transcripter/config.yaml:ro
      - /srv/transcripter/profiles:/etc/transcripter/profiles:ro
      # Read-write: the API serves generated digests + reads the moved audio +
      # READS the worker-built semantic index files; DELETE /recordings/{id}
      # sweeps the recording's vault folder (rmtree) through this mount.
      # The worker remains the sole writer during pipeline exports.
      - ${VAULT_DIR:-./storage/transcripts}:/transcripts:rw
      # Phase 3.5 local embed backend: bge-m3 ONNX int8 (read-only) so
      # the api can embed search queries without a separate container.
      - models:/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    image: ghcr.io/megastruktur/transcripter:v0.21.1-worker
    environment:
      TRANSCRIPTER_CONFIG: /etc/transcripter/config.yaml
      TEMPORAL_ADDRESS: temporal:7233
      # Empty default keeps config.yaml effective; a value set in .env wins.
      DIARIZATION_ENDPOINT: ${DIARIZATION_ENDPOINT:-}
      # Layer 2: pyannote SpeechSeparation endpoint. Empty default keeps
      # config.yaml effective; a value set in .env wins (and forces
      # separation enabled — see worker/config.py SEPARATION_ENDPOINT).
      SEPARATION_ENDPOINT: ${SEPARATION_ENDPOINT:-}
      # Pin the faster-whisper download cache to the `models` volume so a
      # container recreate doesn't re-download weights (local backend only).
      WHISPER_DOWNLOAD_ROOT: ${WHISPER_DOWNLOAD_ROOT:-/models}
      # Platform speaches API key (transcribe.api_key_env references this var).
      SPEACHES_API_KEY: ${SPEACHES_API_KEY:-}
      # LiteLLM virtual key for the summarize stage (summarize.api_key_env).
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      # Phase 3.5: embedding backend overrides (win over config.yaml
      # graph.embed.*) — switch the embedder provider without touching
      # the mounted config.
      EMBED_BACKEND: ${EMBED_BACKEND:-}
      EMBED_BASE_URL: ${EMBED_BASE_URL:-}
      EMBED_MODEL: ${EMBED_MODEL:-}
      # Summarize model id override (wins over config.yaml summarize.model).
      SUMMARIZE_MODEL: ${SUMMARIZE_MODEL:-}
      # Neo4j password for the optional graph profile (graph.password_env
      # in config.yaml). Empty default = graph layer disabled; the enrich
      # stage will report `skipped` without it (best-effort, like diarize).
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
      # Vault mode: VAULT_DIR set → vault is the durable home (the export
      # moves the meta tree + audio into the vault; /storage/recordings/{id}
      # is deleted — storage = scratch). Empty → storage mode (legacy).
      TRANSCRIPTER_VAULT_MODE: ${TRANSCRIPTER_VAULT_MODE:-}
    volumes:
      # c2: staging is a named volume (local NVMe) — no dev-checkout binds.
      - staging:/storage
      # Host-side vault dir (Obsidian); empty default keeps the feature
      # working locally (./storage/transcripts, no vault) for tests/e2e.
      - ${VAULT_DIR:-./storage/transcripts}:/transcripts
      - models:/models
      - /srv/transcripter/config.yaml:/etc/transcripter/config.yaml:ro
      - /srv/transcripter/profiles:/etc/transcripter/profiles:ro
    # Note: NO `depends_on: neo4j` — the graph profile is opt-in (like
    # diarization). When `--profile graph` is OFF, the enrich stage checks
    # cfg.graph.enabled at runtime and reports `skipped`; the worker starts
    # fine without the neo4j container.
    depends_on:
      temporal:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: transcripter
      POSTGRES_PASSWORD: transcripter
      POSTGRES_DB: transcripter
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transcripter"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.28.2
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: transcripter
      POSTGRES_PWD: transcripter
      POSTGRES_SEEDS: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.35.0
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      # Loopback only — admin UI without auth, keep it off the LAN.
      - "127.0.0.1:8082:8080"
    depends_on:
      - temporal
    restart: unless-stopped

  diarization:
    image: lintoai/linto-diarization-pyannote:2.3.0
    profiles: ["diarization"]
    environment:
      SERVICE_MODE: http
    ports:
      - "8070:80"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:80/healthcheck', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  # Optional speech separation (overlapping speakers in mono recordings):
  # pyannote SpeechSeparation. Start with: docker compose --profile separation up -d
  # The `separate` pipeline stage degrades to LinTO-only diarization when
  # this service is absent (same opt-in pattern as diarization).
  separation:
    image: transcripter-separation:0.1.0
    profiles: ["separation"]
    environment:
      SEPARATION_DEVICE: cpu
    ports:
      - "8072:80"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:80/healthcheck', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    restart: unless-stopped

  # Optional diarization: BUT-FIT DiariZen (EEND-VC: overlap-aware local
  # windows + global VBx clustering — no speaker-count cap, unlike
  # Sortformer's hard 4). Replaces LinTO for 5+ speaker recordings.
  # Start with: docker compose --profile diarizen up -d
  # The worker's DIARIZATION_ENDPOINT points here when the bundled service
  # is used (set DIARIZATION_ENDPOINT=http://diarizen:80 in .env, or leave
  # the default config endpoint which this service answers on the same
  # contract). Weights (~350 MB) download into the named volume on first
  # start; license: MIT code + CC-BY-NC-4.0 weights (personal self-host).
  diarizen:
    image: transcripter-diarizen:0.1.0
    profiles: ["diarizen"]
    environment:
      DIARIZEN_MODEL: ${DIARIZEN_MODEL:-BUT-FIT/diarizen-wavlm-base-s80-md}
    volumes:
      - diarizen-hf-cache:/cache/huggingface
    ports:
      - "8071:80"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:80/healthcheck', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  # Optional STT backend: OpenAI-compatible faster-whisper server.
  # Start with: docker compose --profile stt up -d
  # Route transcription to it via config.yaml:
  #   transcribe.backend=api, model=Systran/faster-whisper-small,
  #   base_url=http://speaches:8000/v1  (the /v1 suffix is required).
  # The model MUST be preloaded (uncached models 404); first start downloads
  # weights from huggingface.co into the named volume.
  speaches:
    image: ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cpu
    profiles: ["stt"]
    environment:
      PRELOAD_MODELS: '["Systran/faster-whisper-small"]'
    # Multi-host deployments: publish the port and point the worker at
    # http://<speaches-host>:8000/v1 instead.
    # ports:
    #   - "8000:8000"
    volumes:
      - speaches-hf-cache:/home/ubuntu/.cache/huggingface/hub
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health', timeout=5)\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5m  # first start downloads weights (~minutes) — see e2e preload budget
    restart: unless-stopped

  # Optional knowledge-graph backend (Neo4j CE 5.26, LTS 5.26.30).
  # Start with: docker compose --profile graph up -d
  # Backs the `enrich` stage when a profile carries an `enrich:` section;
  # without this profile (or without NEO4J_PASSWORD set) the enrich stage
  # reports `skipped` and the recording completes normally. The worker
  # never depends_on neo4j — same opt-in pattern as `diarization`.
  # Security: image pinned per SECURITY.md pre-update checklist
  # (amd64 manifest digest sha256:b7deccb0181b9ad9cbeaf1728d099066fe30210e42bf1e1295da1c587eee4012;
  # internal version Neo4j 5.26.30, pulled 2026-08-27). Pulled: 2026-08-27.
  # Ports are NOT published — the bolt driver reaches it on the compose
  # network at bolt://neo4j:7687 (config.yaml graph.uri). AUTH is mandatory
  # (NEO4J_AUTH=neo4j/<password>) — the worker passes NEO4J_PASSWORD env.
  # mem_limit caps the JVM heap + page cache; the bundled Neo4j image
  # defaults to 512m heap which is fine for the enrich workload (small
  # batches of MERGE per recording).
  neo4j:
    image: neo4j:5.26-community
    profiles: ["graph"]
    environment:
      # NEO4J_AUTH format is neo4j/<password>; compose substitutes the
      # .env value and refuses to start if NEO4J_PASSWORD is empty/unset.
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env to enable --profile graph}
    volumes:
      - neo4jdata:/data
    mem_limit: 1.5g
    healthcheck:
      # Causal-cluster read endpoint returns 200 once the DB is accepting
      # bolt writes. Cheaper than driving the bolt port from a shell with
      # no curl/cypher-shell available.
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # Separate voice stack on this host? Uncomment to share a docker network
  # across stacks (create first: docker network create voice), then add
  # `networks: [default, voice]` to worker and the ML services.
  # NOTE: `networks:` is a TOP-LEVEL key — uncomment at column 0 (next to
  # `volumes:`), not here inside the services block.
#
#networks:
#  voice:
#    name: voice
#    external: true

volumes:
  pgdata:
  models:
  # c2: transient staging for api+worker (/storage) — local NVMe.
  # DiariZen HF weights cache (profile `diarizen`).
  diarizen-hf-cache:
  # c2: transient staging for api+worker (/storage) — local NVMe.
  staging:
  speaches-hf-cache:
  neo4jdata:
