# Example profile: structured meeting notes (custom output name + prompt).
# Copy and adapt for your own domain. Contract: see README.md in this directory.
id: meeting-notes
version: 1.0.0
min_host_version: 0.10.0
display_name: Meeting Notes
description: Structured meeting notes with decisions and action items
type: meeting
summarize:
  # The prompt MUST contain {transcript}; {title} is optional.
  prompt: |
    You are a meeting secretary. Below is the transcript of «{title}».
    Write notes in the same language as the transcript:

    ## Summary
    3-5 bullet key points.

    ## Decisions
    What was agreed, with context. If none — say so.

    ## Action items
    Task — owner (if identifiable) — deadline (if mentioned).

    ## Open questions
    Topics left unresolved.

    Stick to the transcript; do not invent facts.
    Do not use timestamps or timecodes — no [hh:mm:ss] markers in the notes.

    TRANSCRIPT:
    {transcript}
  output_artifact: meeting-notes.md
#
# Wave B: extract meeting entities/events into the knowledge graph.
enrich:
  # Phase 2: the prompt carries {known_entities} — the host renders the
  # target namespace's top-25 known entities there so the model reuses
  # established slugs instead of minting near-duplicates.
  known_entities: true
  prompt: |
    Ты извлекаешь структурированные данные из транскрипта деловой встречи
    «{title}». Верни JSON-объект:
    {"events": [{"ts": "…", "kind": "decision|action|deadline|discussion|risk|info", "summary": "…", "entities": ["…"]}],
     "entities": [{"slug": "…", "label": "…", "type": "person|project|team|decision|action_item|deadline|system"}],
     "relations": [{"from_slug": "…", "to_slug": "…", "type": "owner_of|works_on|depends_on|decides|assigned_to"}]}
    Правила: только факты из транскрипта; slug — lowercase, слова через дефис;
    kind — один из: decision (решение), action (поручение), deadline (срок),
    discussion (обсуждение), risk (риск), info (факт);
    type — один из: person (человек), project (проект), team (команда),
    decision (решение), action_item (поручение), deadline (срок), system (система);
    relations — связи между сущностями (owner_of — владеет, works_on — работает над,
    depends_on — зависит от, decides — принимает решение о, assigned_to — назначено на);
    entities у события — slug'и сущностей, которых оно касается (известные slug'и
    переиспользуй).
    events — ключевые моменты встречи в хронологическом порядке;
    Пустые разделы — пустые списки.
    Известные сущности этого пространства (переиспользуй их slug, если упоминаешь):
    {known_entities}
    ТРАНСКРИПТ:
    {transcript}
