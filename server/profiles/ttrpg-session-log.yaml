# Example profile: tabletop RPG (TTRPG) session logging.
# Copy and adapt for your own domain. Contract: see README.md in this directory.
id: ttrpg-session-log
version: 1.1.0
min_host_version: 0.10.0
display_name: TTRPG Session Log
description: "Chronicle of a tabletop RPG session: events, loot, NPCs, plot hooks"
type: ttrpg
summarize:
  # The prompt MUST contain {transcript}; {title} is optional.
  prompt: |
    Ты — летописец настольной RPG-сессии. Ниже — транскрипт записи сессии
    «{title}». Составь летопись на русском языке:

    ## Ход сессии
    Хронология ключевых событий: сцены, броски, повороты сюжета (список).

    ## Лут и ресурсы
    Полученные/потраченные предметы, золото, артефакты — с владельцами.

    ## NPC и фракции
    Встреченные персонажи: имя, роль, отношение к партии.

    ## Сюжетные крючки
    Незакрытые линии, обещания, угрозы — что важно к следующей сессии.

    Пиши по фактам транскрипта, без выдумок. Если раздел пуст — так и скажи.
    Не используй таймкоды и временные метки — никаких [чч:мм:сс] и других
    отметок времени в тексте летописи.

    ТРАНСКРИПТ:
    {transcript}
  output_artifact: session-log.md
# Wave B: extract campaign entities/events into the knowledge graph.
enrich:
  # Phase 2: the prompt carries {known_entities} — the host renders the
  # target namespace's top-25 known entities there so the party's NPC,
  # item and location slugs stay stable across sessions.
  known_entities: true
  prompt: |
    Ты извлекаешь структурированные данные из транскрипта настольной
    RPG-сессии «{title}». Верни JSON-объект:
    {"events": [{"ts": "…", "kind": "…", "summary": "…", "entities": ["…"]}],
     "entities": [{"slug": "…", "label": "…", "type": "player|character|npc|mob|party|item|location|faction|quest"}],
     "relations": [{"from_slug": "…", "to_slug": "…", "type": "…"}]}
    Типы entity — выбирай строго по определениям:
    - player — реальный человек за столом; имя бери ТОЛЬКО из контекста
      оператора, не из транскрипта;
    - character — ТОЛЬКО персонажи игроков (PC). Если сущность не PC —
      это npc или mob, никогда character;
    - npc — именованная ЛИЧНОСТЬ мира: имя, роль, реплики. Дружелюбие
      НЕ критерий: враждебный, но именованный и говорящий персонаж — npc.
      Безымянный противник, получивший имя или сюжетную роль, становится
      npc со СВОИМ slug от имени — видовой slug для именованной личности
      запрещён;
    - mob — безымянные/видовые существа и их группы из сражений (гули,
      дуэргары, «стая крыс»); slug — от вида;
    - party — группа героев; ОБЯЗАТЕЛЬНА в каждой экстракции, slug ровно
      «party», label — название группы из контекста оператора;
    - item — предметы, лут, артефакты;
    - location — места, комнаты, здания, подземелья;
    - faction — организации, культы, группировки (но не их рядовые члены);
    - quest — незакрытые сюжетные линии, обещания, угрозы, крючки.
    kind события — один из: combat (бой), loot (лут или трата), discovery
    (находка, открытие), dialogue (значимый разговор), decision (решение
    партии), level_up (повышение уровня), death (смерть), state_change
    (иное изменение состояния сущности).
    relations — только из списка: member_of (состоит в), played_by
    (персонажа играет игрок), owns (владеет), located_in (находится в),
    enemy_of (враг), allied_with (союзник), knows (знаком), leads
    (ведёт/руководит).
    Правила: только факты из транскрипта; игроки и состав партии — из
    контекста оператора; slug — lowercase, слова через дефис; известные
    slug'и переиспользуй; entities у события — slug'и сущностей, которых
    оно касается.
    Пустые разделы — пустые списки.
    Известные сущности этого пространства (переиспользуй их slug, если упоминаешь):
    {known_entities}
    Контекст серии от оператора (кто есть кто: игроки, кто кого играет,
    название партии; справочная информация, не факты транскрипта —
    используй для правильных типов и имён):
    {tag_context}
    Правила-поправки оператора к прошлым экстракциям (приоритетнее
    остальных правил):
    {corrections}
    ТРАНСКРИПТ:
    {transcript}
