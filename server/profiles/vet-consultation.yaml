# Recording-type profile: veterinary consultation — structured protocol
# (summarize) + knowledge-graph extraction (enrich).
# Copy and adapt for your own domain. Contract: see README.md in this directory.
id: vet-consultation
version: 1.0.0
min_host_version: 0.10.0
display_name: Vet Consultation
description: Протокол ветеринарной консультации — осмотр, диагноз, назначения, рекомендации владельцу
type: vet-consultation
summarize:
  # The prompt MUST contain {transcript}; {title} is optional.
  prompt: |
    Ты — ветеринарный врач, оформляющий протокол приёма. Ниже — транскрипт
    записи консультации «{title}». Составь протокол на языке транскрипта
    со следующими разделами:

    ## Пациент
    Вид, порода, кличка, возраст, вес — только если упомянуты в транскрипте.

    ## Жалобы и анамнез
    Со слов владельца: что беспокоит, как давно, что уже предпринимали.

    ## Осмотр и результаты исследований
    Данные осмотра, анализы, УЗИ, рентген и другие исследования — только
    упомянутые, с результатами как они прозвучали.

    ## Диагноз
    Основной, дифференциальный, предварительный — как звучал в разговоре.

    ## Лечение и назначения
    Каждое назначение отдельной строкой: препарат — доза — кратность —
    длительность.

    ## Рекомендации владельцу
    Уход, диета, ограничения, тревожные симптомы — при которых нужно
    обратиться к врачу срочно.

    ## Повторный приём / контрольные исследования
    Когда и зачем: срок и цель контроля.

    ЖЁСТКОЕ ПРАВИЛО БЕЗОПАСНОСТИ: препараты и дозировки выписывай ТОЛЬКО
    как произнесены в транскрипте. Если препарат или доза названы
    неразборчиво — пиши «доза не уточнена». НИКОГДА не выдумывай дозы
    и не подставляй стандартные/типовые дозировки, даже если кажется,
    что знаешь их.

    Пиши строго по фактам транскрипта, без домыслов. Если раздел пуст —
    так и напиши. Не используй таймкоды и временные метки — никаких
    [чч:мм:сс] и других отметок времени в тексте протокола.

    ТРАНСКРИПТ:
    {transcript}
  output_artifact: vet-consultation.md
# Wave B: extract patient/owner/clinic entities and clinical events into
# the knowledge graph.
enrich:
  # Phase 2: the prompt carries {known_entities} — the host renders the
  # target namespace's top-25 known entities there so patient/clinic
  # slugs stay stable across visits of the same animal.
  known_entities: true
  prompt: |
    Ты извлекаешь структурированные данные из транскрипта ветеринарной
    консультации «{title}». Верни JSON-объект:
    {"events": [{"ts": "…", "kind": "…", "summary": "…", "entities": ["…"]}],
     "entities": [{"slug": "…", "label": "…", "type": "…"}],
     "relations": [{"from_slug": "…", "to_slug": "…", "type": "…"}]}
    Типы entity — выбирай строго по определениям:
    - animal — пациент: кличка и/или вид животного (например «Мурка —
      кошка»);
    - owner — владелец-человек, как назван в разговоре;
    - veterinarian — лечащий врач, ведущий приём;
    - symptom — симптом или жалоба;
    - diagnosis — поставленный или обсуждаемый диагноз;
    - medication — препарат; доза ТОЛЬКО из транскрипта, если неразборчива —
      «доза не уточнена»; НИКОГДА не подставляй стандартные дозы;
    - procedure — процедура или исследование (осмотр, анализ, УЗИ,
      рентген, операция);
    - vaccine — вакцина или прививка;
    - clinic — клиника или кабинет, если упомянуты.
    kind события — один из: examination (осмотр или исследование),
    diagnosis (постановка или обсуждение диагноза), prescription
    (назначение препарата), treatment (процедура или манипуляция),
    vaccination (прививка), follow_up (повторный приём или контроль),
    info (иной значимый факт).
    relations — только из списка: owned_by (животное принадлежит
    владельцу), treated_by (пациент лечится у врача), diagnosed_with
    (пациенту поставлен диагноз), prescribed (препарат назначен врачом),
    symptom_of (симптом относится к заболеванию), follow_up_for
    (контроль относится к диагнозу или лечению).
    Правила: только факты из транскрипта; дозы препаратов — только как
    произнесены; slug — lowercase, слова через дефис; известные slug'и
    переиспользуй; entities у события — slug'и сущностей, которых оно
    касается.
    Пустые разделы — пустые списки.
    Известные сущности этого пространства (переиспользуй их slug, если упоминаешь):
    {known_entities}
    Контекст от оператора (кто есть кто: кличка пациента, владелец, врач,
    клиника; справочная информация, не факты транскрипта):
    {tag_context}
    Правила-поправки оператора к прошлым экстракциям (приоритетнее
    остальных правил):
    {corrections}
    ТРАНСКРИПТ:
    {transcript}
