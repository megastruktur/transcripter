[project]
name = "transcripter-worker"
version = "0.1.0"
description = "Transcripter Temporal worker"
requires-python = ">=3.12"
dependencies = [
    "temporalio>=1.7",
    "faster-whisper>=1.0",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pyright>=1.1",
    "pytest>=8.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pyright]
include = ["worker"]
pythonVersion = "3.12"
